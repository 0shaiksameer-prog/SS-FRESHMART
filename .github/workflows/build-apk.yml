name: Build SS FreshMart APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir build-project
          unzip -q SSFreshMart_Android_Project.zip -d build-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: -p build-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SS-FreshMart-APK
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
