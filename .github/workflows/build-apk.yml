name: Build SS FreshMart APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          mkdir -p build-project
           ZIP_FILE=$(find . -maxdepth 1 -type f -name 'SSFreshMart_Online_Checkout_Project.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p build-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SS-FreshMart-APK
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
